name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned to the same version as .pre-commit-config.yaml so local hooks
      # and CI never disagree.
      - name: Install Ruff
        run: pip install 'ruff==0.11.11'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
        continue-on-error: true  # formatting is not yet enforced repo-wide

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs the package plus its runtime dependencies, which also proves
      # the Poetry build metadata is valid on every push.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Pre-download NLTK data
        run: |
          python - <<'PY'
          import nltk
          for r in ("punkt", "punkt_tab", "averaged_perceptron_tagger",
                    "averaged_perceptron_tagger_eng", "wordnet", "stopwords"):
              nltk.download(r, quiet=True)
          PY

      # Run from a scratch directory: DB_PATH is CWD-relative, so this also
      # verifies the schema is auto-created outside the repo root.
      - name: Run tests
        run: |
          mkdir -p "$RUNNER_TEMP/run"
          cd "$RUNNER_TEMP/run"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -t "$GITHUB_WORKSPACE" -v

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # No Ollama on the runner, so only the offline paths are exercised.
      - name: Verify entry points and offline scoring
        run: |
          cd "$RUNNER_TEMP"
          greenprompt --help
          gprompt --help
          greenp score "You are a physics tutor. Explain inertia. Format: bullet points."
          python -c "from greenprompt import constants; print('OS resolved to', constants.OS)"
